name: Deploy to GitHub Pages

# Manual-only since 2026-09-12. Cloudflare Pages is the live host and builds
# from this same branch, so an automatic run here published a second, fully
# indexable copy of the whole site at punit461.github.io/toolzonex/ on every
# push -- and Google was picking that copy as canonical over toolzonex.com
# (confirmed via URL Inspection on /health/bmi-calculator).
#
# Kept as a one-click fallback if Cloudflare ever fails: run it from the
# Actions tab, then re-enable Pages in repo Settings. Do NOT restore the push
# trigger without first unpublishing or noindexing the Pages site, or the
# duplicate comes straight back.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: https://toolzonex.com
          NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_PUBLISHER_ID }}
          NEXT_PUBLIC_CONTACT_SHEET_URL: ${{ secrets.NEXT_PUBLIC_CONTACT_SHEET_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
